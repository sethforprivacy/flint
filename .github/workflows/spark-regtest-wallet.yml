name: Spark regtest wallet

# Prints where to send money to the CI regtest wallet, and how much it already has.
#
# Run this by hand (Actions > Spark regtest wallet > Run workflow) when you are standing the wallet up for the
# first time, or when the `funded-regtest-test` job has told you the wallet is drained and you want to check the
# balance before or after a top-up.
#
# WHAT THIS WORKFLOW DELIBERATELY DOES NOT DO: generate the seed. The natural design — CI mints a mnemonic and
# hands it back — has no safe return channel. An encrypted artefact needs a passphrase, and the only channel a
# workflow_dispatch offers is its inputs, which GitHub stores against the run *unmasked* and shows to everyone
# with read access; that puts the key beside the lock. Artifacts are also downloadable by every user with read
# access and are retained for months, so a passphrase that leaks once is a permanent compromise of the wallet.
#
# So the seed is generated on the operator's own machine, offline, and the only time it crosses a network is
# when the operator pastes it into GitHub's secret form over TLS. The generator
# (`SparkRegtestWalletTool.Generate_a_wallet_mnemonic_for_the_operator_to_store`) asserts that GITHUB_ACTIONS is
# not set, so this cannot be quietly changed later. Generation needs no network, which is what makes it work
# for a maintainer whose IP the SSP blocks. See docs/testing.md, "A funded regtest wallet for CI".

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  deposit-address:
    name: Print the CI wallet's deposit address
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      # The secrets context is not available to a job-level `if`, so the check is a step. Failing rather than
      # skipping is deliberate: someone pressed "Run workflow" to get an address, and a green run that silently
      # produced nothing is worse than a red one that says why.
      - name: Require the wallet secret
        env:
          SPARK_REGTEST_SEED: ${{ secrets.SPARK_REGTEST_SEED }}
        run: |
          if [ -z "${SPARK_REGTEST_SEED}" ]; then
            echo "::error::The repository secret SPARK_REGTEST_SEED is not set, so there is no wallet to look up."
            echo "Generate a seed on your own machine first — never here, the generator refuses to run in CI:"
            echo "  SPARK_REGTEST_WALLET_GENERATE=1 dotnet test \\"
            echo "    --filter 'FullyQualifiedName~Generate_a_wallet_mnemonic' --output Detailed"
            echo "Then store it as SPARK_REGTEST_SEED under Settings > Secrets and variables > Actions,"
            echo "and run this workflow again. Full runbook: docs/testing.md, 'A funded regtest wallet for CI'."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (plugin + tests)
        # -m:1 serialises MSBuild project scheduling. Not for speed obviously, but for correctness:
        # the test project pins StaticWebAssetsEnabled=false on its ProjectReferences, which makes the
        # btcpayserver closure build a second time under different global properties than the solution's
        # own entries -- two builds of the same project, one output directory. On the v2.4.1 graph the
        # two never collided; the v2.4.2 graph re-timed them and every job on the bump PR failed with
        # "GenerateDepsFile ... deps.json ... being used by another process". The same class of race is
        # documented for local fresh-worktree builds. Serialising the scheduler removes the collision at
        # the cost of wall-clock; if that cost ever matters, the real fix is unifying the global
        # properties, not removing this flag and hoping the timing holds.
        run: dotnet build BTCPayServer.Plugins.Flint.slnx --configuration Release -m:1

      # No API key: regtest accepts a null one. The tool prints the identity pubkey, the balance and the static
      # deposit address to the job log and to the run summary, and asserts the mnemonic is in neither.
      #
      # --output Detailed is load-bearing here in a way it is not elsewhere: this job exists to *read* what the
      # tool printed, and the default verbosity does not show a passing test's output. It is Microsoft.Testing.
      # Platform's replacement for the VSTest `--logger "console;verbosity=detailed"` this used before the test
      # project moved to MTP (see the test .csproj). MTP does not reject the old flag -- it takes it as a
      # filter, matches nothing, and exits 5 with "Zero tests ran".
      - name: Look up the deposit address
        env:
          SPARK_REGTEST_SEED: ${{ secrets.SPARK_REGTEST_SEED }}
        run: >
          dotnet test BTCPayServer.Plugins.Flint.Tests/BTCPayServer.Plugins.Flint.Tests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName~Print_the_funding_details"
          --output Detailed
